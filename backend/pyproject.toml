[project]
name = "heattransplan-backend"
version = "1.0.0"
description = "HeatTransPlan FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
    "Pillow>=11.0.0",
    "staticmap>=0.5.7",
    "folium>=0.18.0",
    "requests>=2.32.0",
    "tabulate>=0.9.0",
    "scikit-learn==1.7.2",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
