name: CI

# Runs the tests, the type check and the production build on every push and
# pull request, so a change that breaks one of them is flagged on the commit
# instead of being found later by hand.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the production image runs (backend/Dockerfile).
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the production image builds with (frontend/Dockerfile).
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npx vitest run

      # The same command the Docker image runs: type check, then bundle.
      - name: Build
        working-directory: frontend
        run: npm run build

      # The codebase predates this check and carries existing lint errors. Fail
      # only when a change adds to them, so new code is held to the rules while
      # the old errors are paid down. Lower the number as they are fixed.
      - name: Lint (no new errors)
        working-directory: frontend
        env:
          MAX_LINT_ERRORS: 132
        run: |
          npx eslint . -f json -o eslint.json || true
          node -e '
            const errors = require("./eslint.json").reduce((n, f) => n + f.errorCount, 0);
            const max = Number(process.env.MAX_LINT_ERRORS);
            console.log(`eslint errors: ${errors} (allowed: ${max})`);
            if (errors > max) {
              console.error(`::error::This change adds ${errors - max} eslint error(s). Run "npx eslint ." in frontend/ to see them.`);
              process.exit(1);
            }
            if (errors < max) console.log(`::notice::Down to ${errors} — lower MAX_LINT_ERRORS in ci.yml to lock that in.`);
          '
