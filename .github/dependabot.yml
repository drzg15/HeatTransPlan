# Weekly checks for updates with known security fixes, one pull request each.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /mcp_server
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /frontend, /docs]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
