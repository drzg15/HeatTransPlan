
services:
  backend:
    build:
      # The repository root: the image also carries mcp_server/ and docs/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: heattransplan-backend
    restart: unless-stopped
    environment:
      # AI_ENABLED=0 in .env hides Connect AI and turns off the MCP server.
      AI_ENABLED: ${AI_ENABLED:-1}
    # Hardened: read-only except /tmp, no special rights, no way to gain any.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      # Only the trained model and its validity ranges — the modelling data
      # stays off the server entirely.
      - ./models:/app/models:ro
      # Who changed what (app/services/activity_log.py); trims itself at 20 MB.
      - activity_log:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes VITE_* into the bundle at build time, so this is a build
        # arg rather than a runtime environment variable. Empty means the
        # browser calls /api on its own origin and the caddy service below
        # routes it to the backend.
        VITE_API_BASE: ""
    container_name: heattransplan-frontend
    depends_on:
      - backend
    restart: unless-stopped
    # Serves files only: read-only, no special rights but binding its port.
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  docs:
    # The documentation site, served at /docs.
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: heattransplan-docs
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    container_name: heattransplan-caddy
    # Certificates live in its volumes; it needs only to bind ports 80 and 443.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - frontend
      - backend
      - docs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      # Set per machine in .env (not in git); unset serves plain http on port 80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  activity_log:
  caddy_data:
  caddy_config:
