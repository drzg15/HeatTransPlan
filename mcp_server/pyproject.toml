[project]
name = "heattransplan-mcp"
version = "3.0.0"
description = "MCP server that lets an AI work with HeatTransPlan: projects, analysis, economics, reports, and the open page"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
heattransplan-mcp = "heattransplan_mcp.server:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heattransplan_mcp"]
